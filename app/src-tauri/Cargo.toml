[package]
name = "h-mouse-config"
version = "0.1.4"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# For development: uses all cores and reuses earlier work, the EXE gets somewhat larger.
[profile.fast]
inherits = "release"
codegen-units = 16
incremental = true
lto = false
